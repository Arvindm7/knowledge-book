# ==============================================================================
# GitHub Actions: book-website → Build & Deploy to Vercel
# ==============================================================================
#
# This workflow is triggered by:
#   1. repository_dispatch from the knowledge-base repo (content changes)
#   2. push to main (website code changes)
#
# Pipeline:
#   1. Checkout book-website
#   2. Clone knowledge-base into .content/knowledge-base/
#   3. Run content generation script (routes, sidebar, metadata)
#   4. Build Next.js static site
#   5. Deploy to Vercel
#
# Required secrets:
#   GITHUB_TOKEN      — Auto-provided by GitHub Actions
#   KNOWLEDGE_BASE_REPO — e.g., "username/knowledge-base"
#   VERCEL_TOKEN      — Vercel API token
#   VERCEL_ORG_ID     — Vercel organization/team ID
#   VERCEL_PROJECT_ID — Vercel project ID
# ==============================================================================

name: Build & Deploy

on:
  repository_dispatch:
    types:
      - knowledge-base-updated
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger for debugging

env:
  NODE_VERSION: '20'
  KNOWLEDGE_BASE_REPO: ${{ secrets.KNOWLEDGE_BASE_REPO || vars.KNOWLEDGE_BASE_REPO || '' }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      # ---- Checkout website code ----
      - name: Checkout book-website
        uses: actions/checkout@v4

      # ---- Setup Node.js ----
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ---- Install dependencies ----
      - name: Install dependencies
        run: npm ci

      # ---- Clone knowledge-base ----
      - name: Clone knowledge-base repository
        run: |
          echo "→ Cloning knowledge-base..."
          git clone --depth 1 \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.KNOWLEDGE_BASE_REPO }}.git \
            .content/knowledge-base
          echo "✓ Clone complete"
          echo "  Files: $(find .content/knowledge-base -name '*.md' -o -name '*.mdx' | wc -l) markdown files"

      # ---- Generate content manifests ----
      - name: Generate content manifests
        run: |
          echo "→ Running content generation pipeline..."
          node scripts/generate-content.mjs
        env:
          CONTENT_DIR: .content/knowledge-base

      # ---- Build Next.js ----
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_KNOWLEDGE_BASE_REPO: ${{ env.KNOWLEDGE_BASE_REPO }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://your-site.vercel.app' }}

      # ---- Deploy to Vercel ----
      - name: Deploy to Vercel
        run: |
          npx -y vercel deploy --prebuilt --prod \
            --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ---- Summary ----
      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "**Trigger:** Content update from knowledge-base" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** \`${{ github.event.client_payload.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Message:** ${{ github.event.client_payload.message }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Trigger:** Website code push" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
